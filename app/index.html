<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenSix</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <meta name="theme-color" content="#251631">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/ui.mjs"></script>
</head>
<body>
  <header class="app-bar">
    <div class="brand"><img class="brand-icon" src="/icon.svg" alt="" width="47" height="36"><span>OpenSix</span></div>
    <nav class="app-menu" aria-label="OpenSix tools">
      <details>
        <summary>Archive</summary>
        <div class="menu-items">
          <button type="button" data-action="open">Open RPF9…</button>
          <button type="button" data-action="pool">Open texture pool…</button>
          <button type="button" data-action="names" data-archive-only>Import paths…</button>
          <button type="button" data-action="search" data-archive-only>Search open archives…</button>
          <button type="button" data-action="entries" data-archive-only>Export archive index…</button>
          <button type="button" data-action="shaders" data-archive-only>Export shader index…</button>
        </div>
      </details>
      <details>
        <summary>World</summary>
        <div class="menu-items">
          <button type="button" data-tool="terrain">Terrain map…</button>
          <button type="button" data-tool="toolMap">Map placements…</button>
          <button type="button" data-tool="toolNavmesh">Navigation mesh…</button>
          <button type="button" data-tool="toolTimecycle">Timecycle and weather…</button>
        </div>
      </details>
      <details>
        <summary>Assets</summary>
        <div class="menu-items">
          <button type="button" data-tool="toolHandling">Vehicle handling…</button>
          <button type="button" data-tool="toolGroom">Hair and fur guides…</button>
          <button type="button" data-tool="toolCloth">Cloth constraints…</button>
          <button type="button" data-tool="toolParticles">Particle effects…</button>
          <button type="button" data-tool="bank">Audio bank…</button>
          <button type="button" data-tool="movie">Bink movie…</button>
        </div>
      </details>
      <details>
        <summary>Data</summary>
        <div class="menu-items">
          <button type="button" data-tool="toolText">Localization strings…</button>
          <button type="button" data-tool="toolPso">Typed PSIN…</button>
          <button type="button" data-tool="toolScript">Script document…</button>
        </div>
      </details>
    </nav>
    <div class="toolbar">
      <button id="import-names" type="button" disabled>Import paths</button>
      <button id="open" class="primary" type="button">Open archive</button>
      <input id="name-file" type="file" accept=".txt,.csv,.list,text/plain" hidden>
    </div>
  </header>
  <main class="workspace">
    <aside class="sidebar" aria-label="Archive navigation">
      <h2>Archives</h2>
      <nav id="archives" aria-label="Open archives"><p class="quiet">No archives open</p></nav>
      <section id="folders-section" hidden>
        <h2>Resolved folders</h2>
        <nav id="folders" aria-label="Resolved folders"></nav>
      </section>
    </aside>
    <section class="contents" aria-label="Archive entries">
      <div class="library-heading">
        <div>
          <p id="breadcrumb" class="breadcrumb">Local workspace</p>
          <h1 id="archive-name">Archive browser</h1>
          <p id="archive-meta" class="quiet">Open an RPF9 archive or a folder of archives.</p>
        </div>
      </div>
      <div id="entry-tools" class="entry-tools" hidden>
        <label class="search"><span class="sr-only">Search entries</span>
          <input type="search" id="search" placeholder="Search entries">
        </label>
        <button id="index-model-labels" type="button">Index model labels</button>
        <label><span class="sr-only">Filter entries</span>
          <select id="filter">
            <option value="all">All entries</option>
            <option value="resolved">Resolved names</option>
            <option value="unresolved">Unresolved names</option>
          </select>
        </label>
      </div>
      <p id="notice" class="notice" role="status" hidden></p>
      <div id="entry-scroll" class="entry-scroll" hidden>
        <table>
          <thead><tr><th scope="col">Name</th><th scope="col">Format</th><th scope="col" class="number">Size</th><th scope="col" class="number">Offset</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="pager" class="pager" hidden>
        <span id="page-text"></span>
        <button id="previous" type="button">Previous</button>
        <button id="next" type="button">Next</button>
      </div>
    </section>
    <aside class="details" aria-label="Entry details">
      <h2>Details</h2>
      <p id="selection-empty" class="quiet">Select an entry to inspect or extract it.</p>
      <section id="selection" hidden>
        <p id="entry-kind" class="entry-kind"></p>
        <h3 id="entry-name"></h3>
        <p id="entry-path" class="quiet"></p>
        <dl id="properties"></dl>
        <div class="extract-actions">
          <button id="extract" class="primary" type="button">Extract file</button>
          <button id="stored" type="button">Save stored bytes</button>
          <button id="nested" type="button" hidden>Open nested archive</button>
        </div>
        <h4>Preview</h4>
        <p id="preview-note" class="quiet"></p>
        <div id="resource-preview" hidden></div>
        <pre id="preview" tabindex="0"></pre>
      </section>
    </aside>
  </main>
  <dialog id="open-dialog">
    <form id="open-form">
      <div class="dialog-title"><h2>Open RPF9 archives</h2><button id="close-dialog" type="button" aria-label="Close">×</button></div>
      <label for="exe-path">Matching Scarlett executable</label>
      <div class="path-picker">
        <input id="exe-path" type="text" required spellcheck="false">
        <button id="choose-exe" type="button">Browse</button>
      </div>
      <label for="archive-path">RPF9 file or archive folder</label>
      <div class="path-picker">
        <input id="archive-path" type="text" required spellcheck="false">
        <button id="choose-archive" type="button">File</button>
        <button id="choose-folder" type="button">Folder</button>
        <button id="choose-pool" type="button">Texture pool</button>
      </div>
      <p id="open-error" class="notice" role="alert" hidden></p>
      <div class="dialog-actions"><button id="cancel" type="button">Cancel</button><button class="primary" id="submit" type="submit">Open</button></div>
    </form>
  </dialog>
  <dialog id="tool-dialog" aria-labelledby="tool-title">
    <div class="dialog-title"><h2 id="tool-title"></h2><button id="close-tool" type="button" aria-label="Close tool">×</button></div>
    <form id="tool-source">
      <p id="tool-selection" class="quiet"></p>
      <div class="tool-actions">
        <button id="tool-selected" class="primary" type="submit">Use selected entry</button>
        <button id="tool-browse" type="button">Open decoded file…</button>
        <label id="tool-road-filter" hidden><input type="checkbox" id="tool-roads"> Roads only</label>
      </div>
    </form>
    <form id="tool-search-form" hidden>
      <label for="tool-query">Search names, hashes or model labels</label>
      <div class="path-picker"><input id="tool-query" type="search" required maxlength="250"><button type="submit">Search</button></div>
    </form>
    <p id="tool-status" class="notice" role="status" hidden></p>
    <div id="tool-output"></div>
  </dialog>
</body>
</html>
