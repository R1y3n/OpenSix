name: Build Linux

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish a prerelease with the built packages
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - 'linux-*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out the fork
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 patchelf ffmpeg \
            libgtk-3-dev libnss3-dev libasound2-dev libxss1 libgbm-dev \
            libdrm-dev libxkbcommon-dev libatk-bridge2.0-dev \
            libatspi2.0-dev libpango1.0-dev libcups2-dev libfuse2

      - name: Set up Rust 1.100.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          targets: x86_64-unknown-linux-gnu

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .deps/cargo-target-linux
          key: linux-cargo-${{ runner.os }}-${{ hashFiles('native/preview/Cargo.lock', 'native/bcpack/Cargo.lock') }}
          restore-keys: linux-cargo-${{ runner.os }}-

      - name: Build all native components and Linux packages
        run: ./scripts/build-linux.sh

      - name: Check native helper formats
        run: |
          file app/worker/opensix-preview app/worker/opensix-pool \
            app/worker/opensix-fbx app/worker/6ixpack app/worker/libopensix_bcpack.so
          file app/worker/opensix-preview app/worker/opensix-pool \
            app/worker/opensix-fbx app/worker/6ixpack | grep -q ELF

      - name: Check packaged resources
        run: |
          ls -lh app/release/
          tar -tf app/release/OpenSix-*-x64.tar.xz | grep -E \
            'resources/(assets/ui.bundle.mjs|opensix-preview|opensix-pool|opensix-fbx|6ixpack|libopensix_bcpack\.so)$'

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenSix-linux-x64
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.tar.xz
          if-no-files-found: error

      - name: Publish Linux release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('linux-{0}', github.sha) }}
        run: |
          set -euo pipefail
          assets=(app/release/*.AppImage app/release/*.deb app/release/*.tar.xz)
          notes="Native Linux x64 build from ${GITHUB_SHA}. AppImage, deb and tar.xz include the native preview, pool, FBX, BCPack and 6ixpack helpers."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "OpenSix Linux $TAG" --notes "$notes" --prerelease
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "OpenSix Linux $TAG" \
              --notes "$notes" \
              --prerelease
          fi
